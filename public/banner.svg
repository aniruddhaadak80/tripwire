<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="wash1" cx="12%" cy="-10%" r="60%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wash2" cx="95%" cy="110%" r="62%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.24"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#050506"/>
  <rect width="1200" height="630" fill="url(#wash1)"/>
  <rect width="1200" height="630" fill="url(#wash2)"/>

  <!-- grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <path d="M0 105 H1200 M0 210 H1200 M0 315 H1200 M0 420 H1200 M0 525 H1200"/>
    <path d="M120 0 V630 M240 0 V630 M360 0 V630 M480 0 V630 M600 0 V630 M720 0 V630 M840 0 V630 M960 0 V630 M1080 0 V630"/>
  </g>

  <!-- brand -->
  <g transform="translate(72,64)">
    <circle cx="7" cy="7" r="7" fill="#f43f5e"/>
    <circle cx="7" cy="7" r="13" fill="none" stroke="#f43f5e" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="30" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" letter-spacing="6" fill="#c9c9d1">TRIPWIRE</text>
  </g>

  <!-- headline -->
  <text x="72" y="238" font-family="ui-sans-serif, system-ui, sans-serif" font-size="92" font-weight="300" letter-spacing="-3" fill="#f4f4f5">Everything that could go wrong,</text>
  <text x="72" y="330" font-family="ui-sans-serif, system-ui, sans-serif" font-size="92" font-weight="300" letter-spacing="-3" fill="#f4f4f5">tracked in public.</text>
  <text x="72" y="392" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#8b8b98">Warning signs. Precautions. The mitigations actually working.</text>

  <!-- stat chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <g transform="translate(72,470)">
      <rect width="240" height="86" rx="20" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/>
      <text x="26" y="42" font-size="38" fill="#f4f4f5">45</text>
      <text x="26" y="66" font-size="19" letter-spacing="2" fill="#8b8b98">FAILURE MODES</text>
    </g>
    <g transform="translate(332,470)">
      <rect width="280" height="86" rx="20" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/>
      <text x="26" y="42" font-size="38" fill="#f4f4f5">180</text>
      <text x="26" y="66" font-size="19" letter-spacing="2" fill="#8b8b98">WARNING INDICATORS</text>
    </g>
    <g transform="translate(632,470)">
      <rect width="260" height="86" rx="20" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/>
      <text x="26" y="42" font-size="38" fill="#f4f4f5">311</text>
      <text x="26" y="66" font-size="19" letter-spacing="2" fill="#8b8b98">PRECAUTIONS</text>
    </g>
  </g>

  <!-- footer strip -->
  <g transform="translate(72,586)">
    <circle cx="6" cy="6" r="5" fill="url(#brand)"/>
    <text x="20" y="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="3" fill="#55555f">OPEN SOURCE · MIT · NO ACCOUNTS · NO TRACKING</text>
  </g>
</svg>