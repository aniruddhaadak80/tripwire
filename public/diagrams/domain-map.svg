      <text x="18" y="78" font-size="11" fill="#8b8b98">mean exposure · 5 entries</text>
      <text x="18" y="112" font-size="12.5" fill="#c9c9d1">Top: Ransomware as an</text>
      <text x="18" y="132" font-size="12.5" fill="#c9c9d1">infrastructure outage</text>
      <text x="18" y="160" font-size="11" fill="#f43f5e">90 exposure</text>
