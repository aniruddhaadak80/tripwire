      <text x="18" y="58" font-size="26" fill="#f4f4f5">68</text>
      <text x="18" y="78" font-size="11" fill="#8b8b98">mean exposure · 4 entries</text>
      <text x="18" y="112" font-size="12.5" fill="#c9c9d1">Top: Grid overload and</text>
      <text x="18" y="132" font-size="12.5" fill="#c9c9d1">cascading failure</text>
      <text x="18" y="160" font-size="11" fill="#f43f5e">82 exposure</text>
