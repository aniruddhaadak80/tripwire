      <text x="18" y="30" font-size="11" letter-spacing="2" fill="#a78bfa">MACHINE INTELLIGENCE</text>
      <text x="18" y="58" font-size="26" fill="#f4f4f5">51</text>
      <text x="18" y="78" font-size="11" fill="#8b8b98">mean exposure · 6 entries</text>
      <text x="18" y="112" font-size="12.5" fill="#c9c9d1">Top: Evaluation gaming</text>
      <text x="18" y="132" font-size="12.5" fill="#c9c9d1">and ginned benchmarks</text>
      <text x="18" y="160" font-size="11" fill="#f43f5e">76 exposure</text>
    </g>
    <g transform="translate(300,120)">
      <rect width="200" height="180" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.10)"/>
      <text x="18" y="30" font-size="11" letter-spacing="2" fill="#fb7185">CLIMATE &amp; EARTH SYSTEMS</text>
      <text x="18" y="58" font-size="26" fill="#f4f4f5">63</text>
      <text x="18" y="78" font-size="11" fill="#8b8b98">mean exposure · 6 entries</text>
      <text x="18" y="112" font-size="12.5" fill="#c9c9d1">Top: Runaway heat domes</text>
      <text x="18" y="160" font-size="11" fill="#f43f5e">82 exposure</text>
    </g>
    <g transform="translate(540,120)">
