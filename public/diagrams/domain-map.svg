<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <radialGradient id="wash" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="#0a0a0c"/>
  <rect width="1200" height="675" fill="url(#wash)"/>
  <g stroke="rgba(255,255,255,0.045)" stroke-width="1">
    <path d="M0 168.75 H1200 M0 337.5 H1200 M0 506.25 H1200"/>
    <path d="M300 0 V675 M600 0 V675 M900 0 V675"/>
  </g>

  <text x="600" y="52" text-anchor="middle" font-size="30" font-weight="300" fill="#f4f4f5">The ten watch domains</text>
  <text x="600" y="80" text-anchor="middle" font-size="15" fill="#8b8b98">Mean exposure per domain · highest-exposure entry shown · click any card in the app</text>

  <!-- grid of 10 domain cards: 5 cols x 2 rows -->
  <g font-size="12">
    <!-- Row 1 -->
    <g transform="translate(60,120)">
