      <text x="18" y="112" font-size="12.5" fill="#c9c9d1">Top: Liquidity fragility</text>
      <text x="18" y="132" font-size="12.5" fill="#c9c9d1">and the speed of contagion</text>
      <text x="18" y="160" font-size="11" fill="#f43f5e">74 exposure</text>
