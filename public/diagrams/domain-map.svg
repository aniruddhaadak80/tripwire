      <text x="18" y="30" font-size="11" letter-spacing="2" fill="#f472b6">INFORMATION &amp; SOCIETY</text>
      <text x="18" y="58" font-size="26" fill="#f4f4f5">82</text>
      <text x="18" y="78" font-size="11" fill="#8b8b98">mean exposure · 4 entries</text>
      <text x="18" y="112" font-size="12.5" fill="#c9c9d1">Top: Synthetic evidence</text>
      <text x="18" y="132" font-size="12.5" fill="#c9c9d1">and the visual record</text>
      <text x="18" y="160" font-size="11" fill="#f43f5e">86 exposure</text>
