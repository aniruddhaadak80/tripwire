  <!-- legend -->
  <g transform="translate(60,560)">
    <rect x="0" y="0" width="1080" height="72" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.10)"/>
    <text x="24" y="30" font-size="13" fill="#c9c9d1">Reading the board</text>
    <text x="24" y="52" font-size="12" fill="#8b8b98">Exposure = likelihood × (0.62 + 0.38 × severity) × speed bump · Action priority = exposure × (1 − 0.7 × defence)</text>
    <text x="700" y="30" font-size="13" fill="#c9c9d1">Bands</text>
    <text x="700" y="52" font-size="12" fill="#8b8b98">critical ≥ 72 · elevated ≥ 56 · watch ≥ 40 · monitor below</text>
  </g>
